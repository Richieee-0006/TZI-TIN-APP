<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Catppuccin Mocha gradient pro štít -->
    <linearGradient id="ico-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7"/>   <!-- Mauve -->
      <stop offset="50%" stop-color="#b4befe"/>  <!-- Lavender -->
      <stop offset="100%" stop-color="#89b4fa"/> <!-- Blue -->
    </linearGradient>

    <!-- Hluboké Catppuccin pozadí (Base -> Crust) -->
    <linearGradient id="ico-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
  </defs>

  <!-- 1. Podkladová zaoblená dlaždice (zajišťuje kontrast ve všech motivech prohlížeče) -->
  <rect width="512" height="512" rx="128" fill="url(#ico-bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#313244" stroke-width="12"/>

  <!-- 2. Tělo štítu (zvětšené pro maximální využití prostoru ikony) -->
  <path d="M256 64 L420 126 V270 C420 376 256 448 256 448 C256 448 92 376 92 270 V126 Z"
        fill="#181825"/>

  <!-- 3. Zesílený obrys štítu s vysokým kontrastem -->
  <path d="M256 64 L420 126 V270 C420 376 256 448 256 448 C256 448 92 376 92 270 V126 Z"
        fill="none" stroke="url(#ico-shield)" stroke-width="34" stroke-linejoin="round"/>

  <!-- 4. Dominantní, ultra-tučný text TZI (Catppuccin Text #cdd6f4) -->
  <text x="256" y="278"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
        font-weight="900" font-size="118" fill="#cdd6f4" text-anchor="middle" letter-spacing="2">TZI</text>

  <!-- 5. Zelený Catppuccin Green akcent (#a6e3a1) reprezentující binární jádro/status -->
  <circle cx="256" cy="352" r="22" fill="#a6e3a1"/>
</svg>