<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title>TZI Trenér · Přihlášení</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/auth.css?v=1">
</head>
<body>
    <main class="auth-card">
        <header>
            <div class="brand-mark" aria-hidden="true">
                <svg width="48" height="24" viewBox="0 0 48 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="2" y1="12" x2="10" y2="12"/>
                    <circle cx="16" cy="12" r="6"/>
                    <line x1="22" y1="12" x2="31" y2="12"/>
                    <polyline points="28 9 31 12 28 15"/>
                    <circle cx="38" cy="12" r="6"/>
                    <line x1="44" y1="12" x2="47" y2="12"/>
                </svg>
            </div>
            <h1>TZI Trenér</h1>
            <p class="subtitle">KI/TIN · Teoretická informatika</p>
        </header>

        <!--MESSAGE-->

        <nav class="tabs" aria-label="Volba přihlášení nebo registrace">
            <button type="button" class="tab-btn <!--LOGIN_ACTIVE-->" data-tab="login">Přihlášení</button>
            <button type="button" class="tab-btn <!--REG_ACTIVE-->" data-tab="reg">Registrace</button>
        </nav>

        <section id="login-form" class="<!--LOGIN_DISPLAY-->">
            <form method="POST" action="/login">
                <!--CSRF-->
                <div class="form-group">
                    <label for="login-username">Uživatelské jméno</label>
                    <input type="text" id="login-username" name="username" placeholder="Přezdívka" required autofocus>
                </div>
                <div class="form-group">
                    <label for="login-password">Heslo</label>
                    <input type="password" id="login-password" name="password" placeholder="Heslo" required>
                </div>
                <button type="submit" class="submit-btn">Přihlásit se</button>
            </form>
        </section>

        <section id="reg-form" class="<!--REG_DISPLAY-->">
            <form method="POST" action="/register">
                <!--CSRF-->
                <div class="form-group">
                    <label for="reg-username">Uživatelské jméno</label>
                    <input type="text" id="reg-username" name="username" placeholder="Nová přezdívka" required minlength="2">
                </div>
                <div class="form-group">
                    <label for="reg-password">Heslo</label>
                    <input type="password" id="reg-password" name="password" placeholder="Minimálně 8 znaků" required minlength="8">
                </div>
                <div class="form-group">
                    <label for="reg-password-confirm">Potvrzení hesla</label>
                    <input type="password" id="reg-password-confirm" name="password_confirm" placeholder="Potvrzení hesla" required minlength="8">
                </div>
                <button type="submit" class="submit-btn">Zaregistrovat se</button>
            </form>
        </section>

        <nav class="trial-wrap" aria-label="Zkušební přístup">
            <a href="/trial" class="trial-link">
                <span>Vyzkoušet bez přihlášení (Trial)</span>
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </a>
        </nav>

    </main>

    <footer class="auth-foot">
        <div>Poděkování <b>Zdenax</b> za vytvoření aplikace · <a href="https://github.com/zdenax/TZI-TIN-APP" target="_blank" rel="noopener noreferrer">GitHub: TZI-TIN-APP</a></div>
        <div class="privacy">Soukromí: Žádný tracking, e-maily ani analytika. V databázi je jen hash hesla, přezdívka a studijní postup s možností smazání účtu v profilu.</div>
    </footer>

    <script src="/static/js/login.js?v=1"></script>
</body>
</html>
